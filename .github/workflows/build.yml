name: build.yml
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          
          echo "ANTIFILTER_DOWNLOAD=https://antifilter.download/list/domains.lst" >> $GITHUB_ENV
          echo "ANTIFILTER_DOWNLOAD_COMMUNITY=https://community.antifilter.download/list/domains.lst" >> $GITHUB_ENV
          echo "REFILTER_ALL=https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst" >> $GITHUB_ENV
          
          echo "PETERLOWE_REJECT_URL=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext" >> $GITHUB_ENV
          echo "ADGUARD_DNS_REJECT_URL=https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" >> $GITHUB_ENV
          echo "WIN_SPY=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt" >> $GITHUB_ENV
          echo "WIN_UPDATE=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/update.txt" >> $GITHUB_ENV
          echo "WIN_EXTRA=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/extra.txt" >> $GITHUB_ENV

          # Telegram IP ranges: official published list plus the prefixes their ASNs announce.
          echo "TELEGRAM_CIDR=https://core.telegram.org/resources/cidr.txt" >> $GITHUB_ENV
          echo "TELEGRAM_ASN=62041 62014 59930 44907 211157" >> $GITHUB_ENV
          echo "SING_BOX_VERSION=1.13.18" >> $GITHUB_ENV


          echo "GFW=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/refs/heads/release/gfw.txt" >> $GITHUB_ENV
          echo "GREATFIRE=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/refs/heads/release/greatfire.txt" >> $GITHUB_ENV

          # Curated category set published as sing-box .srs (all of these) and as plain .txt.
          # Popular v2fly services + project/RU categories. geosite.dat still contains every category.
          POPULAR="google youtube discord twitter meta openai telegram twitch github cloudflare netflix spotify tiktok reddit signal steam apple microsoft amazon"
          # Lists exported as plain .txt by domain-list-custom (aggregations/categories it must resolve).
          echo "EXPORT_CATEGORIES=ru-blocked ru-blocked-all ru-available-only-inside category-ads-all $POPULAR" >> $GITHUB_ENV
          # Full .srs whitelist = the above + lists fetched directly (antifilter/refilter/win-*).
          echo "SRS_CATEGORIES=ru-blocked ru-blocked-all ru-available-only-inside category-ads-all antifilter-download antifilter-download-community refilter win-spy win-update win-extra $POPULAR" >> $GITHUB_ENV
          # Categories additionally published as *-full.srs: domain rules plus Telegram IP ranges.
          echo "FULL_CATEGORIES=telegram ru-blocked ru-blocked-all" >> $GITHUB_ENV
        shell: bash

      - name: Checkout runetfreedom/russia-domains-list
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/russia-domains-list
          path: additional

      - name: Checkout runetfreedom/domain-list-custom
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/domain-list-custom
          path: custom

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout runetfreedom/geodat2srs
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/geodat2srs
          path: geodat2srs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum

      - name: Get and add domain lists
        run: |          
          curl -sSL $ANTIFILTER_DOWNLOAD > ./antifilter-download.txt
          curl -sSL $ANTIFILTER_DOWNLOAD_COMMUNITY > ./antifilter-download-community.txt
          curl -sSL $REFILTER_ALL > ./refilter.txt
          curl -sSL $WIN_SPY | grep "0.0.0.0" | awk '{print $2}' > ./win-spy.txt
          curl -sSL $WIN_UPDATE | grep "0.0.0.0" | awk '{print $2}' > ./win-update.txt
          curl -sSL $WIN_EXTRA | grep "0.0.0.0" | awk '{print $2}' > ./win-extra.txt
          
          curl -sSL $GFW > ./community/data/gfw.txt
          curl -sSL $GREATFIRE > ./community/data/greatfire.txt
          
          cp {antifilter-download,antifilter-download-community,refilter,win-spy,win-update,win-extra}.txt ./community/data/
          for f in ./community/data/*.txt; do mv "$f" "${f//.txt/}"; done
          
          rm -rf ./additional/README.md
          mv ./additional/* ./community/data/

      - name: Build ad block
        run: |
          curl -sSL $ADGUARD_DNS_REJECT_URL | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' > temp-reject.txt
          curl -sSL $PETERLOWE_REJECT_URL | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})$/ && print "$1\n"' >> temp-reject.txt
          sed -i '/t.co/d' temp-reject.txt
          cat temp-reject.txt | sort --ignore-case -u > ./community/data/category-ads-all

      - name: Build Russia general blocked list
        run: |
          echo "include:antifilter-download-community" > ./community/data/ru-blocked
          echo "include:refilter" >> ./community/data/ru-blocked
          echo "include:telegram" >> ./community/data/ru-blocked

          echo "include:antifilter-download" > ./community/data/ru-blocked-all
          echo "include:antifilter-download-community" >> ./community/data/ru-blocked-all
          echo "include:refilter" >> ./community/data/ru-blocked-all
          echo "include:telegram" >> ./community/data/ru-blocked-all

      - name: Build Ru only list
        run: |
          mkdir -p ./community/data-ru
          cp ./community/data/{category-ads-all,private,ru-available-only-inside,category-gov-ru} ./community/data-ru/
          cat ./community/data/{antifilter-download-community,refilter,telegram} | sort --ignore-case -u > ./community/data-ru/ru-blocked
          
      - name: Build geosite.dat file
        run: |
          cd custom || exit 1
          go run ./ --exportlists=  --datname=geosite-ru-only.dat --togfwlist=ru-blocked --datapath=../community/data-ru
          go run ./ --exportlists="${EXPORT_CATEGORIES// /,}" --datapath=../community/data

      - name: Move and zip files and generate sha256 hash
        run: |
          install -Dp ./custom/publish/geosite-ru-only.dat ./publish/geosite-ru-only.dat
          install -Dp ./custom/publish/geosite.dat ./publish/geosite.dat
          install -p {antifilter-download,antifilter-download-community,refilter,win-spy,win-update,win-extra}.txt ./publish/
          for c in $EXPORT_CATEGORIES; do install -p "./custom/publish/$c.txt" ./publish/; done
          
          (cd ./publish && sha256sum geosite.dat > geosite.dat.sha256sum)

      - name: Build sing-box SRS rule-sets
        run: |
          cd geodat2srs || exit 1
          go build -o geodat2srs .
          cd ..
          mkdir -p ./tmp-srs ./publish/sing-box ./publish/sing-box-ru-only
          # geodat2srs converts every category; keep only the curated whitelist.
          ./geodat2srs/geodat2srs geosite -i ./publish/geosite.dat -o ./tmp-srs --prefix geosite-
          for c in $SRS_CATEGORIES; do cp "./tmp-srs/geosite-$c.srs" ./publish/sing-box/; done
          ./geodat2srs/geodat2srs geosite -i ./publish/geosite-ru-only.dat -o ./publish/sing-box-ru-only --prefix geosite-

      - name: Install sing-box CLI
        run: |
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          sing-box version

      - name: Build Telegram IP list
        run: |
          curl -sSL "$TELEGRAM_CIDR" > ./telegram-ip.txt
          # ASN prefixes only add to the official list, so a RIPEstat outage must not fail the build.
          for asn in $TELEGRAM_ASN; do
            curl -sSL --max-time 30 "https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS$asn" \
              | jq -r '.data.prefixes[]?.prefix // empty' >> ./telegram-ip.txt || true
          done
          grep -E '^[0-9a-fA-F:.]+/[0-9]{1,3}$' ./telegram-ip.txt | sort -u > ./publish/geoip-telegram.txt
          echo "Telegram prefixes: $(wc -l < ./publish/geoip-telegram.txt)"

      - name: Build Telegram GeoIP and combined rule-sets
        run: |
          # Rule-set format version 1 keeps the output readable by sing-box 1.8+,
          # matching what geodat2srs emits (it is built against the sing-box 1.9 library).
          jq -R -s '{ip_cidr: (split("\n") | map(select(length > 0)))}' ./publish/geoip-telegram.txt > ./tmp-srs/ip-rule.json
          jq '{version: 1, rules: [.]}' ./tmp-srs/ip-rule.json > ./tmp-srs/geoip-telegram.json
          sing-box rule-set compile -o ./publish/sing-box/geoip-telegram.srs ./tmp-srs/geoip-telegram.json
          # Combined sets: the domain rules geodat2srs produced plus one extra ip_cidr rule.
          # Rules inside a rule-set are ORed, so the IP rule must be a separate array entry.
          for c in $FULL_CATEGORIES; do
            sing-box rule-set decompile -o "./tmp-srs/$c-domains.json" "./publish/sing-box/geosite-$c.srs"
            jq -s '{version: 1, rules: (.[0].rules + [.[1]])}' \
              "./tmp-srs/$c-domains.json" ./tmp-srs/ip-rule.json > "./tmp-srs/$c-full.json"
            sing-box rule-set compile -o "./publish/sing-box/$c-full.srs" "./tmp-srs/$c-full.json"
          done

      - name: Package sing-box rule-sets
        run: |
          (cd ./publish/sing-box         && zip -r ../sing-box.zip .)
          (cd ./publish/sing-box-ru-only && zip -r ../sing-box-ru-only.zip .)

      - name: Release and upload assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/*.*

      - name: Upload sing-box .srs rule-sets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          file_glob: true
          file: ./publish/sing-box/*.srs

      - name: Git push assets to "release" branch
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release
